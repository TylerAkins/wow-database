name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          lua5.1 -e 'assert(_VERSION == "Lua 5.1")'

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'

      - name: Check out QuestieDB test runtime
        uses: actions/checkout@v7.0.1
        with:
          repository: Questie/QuestieDB
          ref: master
          path: .cache/QuestieDB
          fetch-depth: 1
          persist-credentials: false

      - name: Offline tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Check compiled zones
        run: python3 tools/compile_zone_files.py --check

      - name: Go tests and vet
        run: |
          go test ./...
          go vet ./...
