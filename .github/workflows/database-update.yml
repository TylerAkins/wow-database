name: Database update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forever-database-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Checkout AllTheThings
        uses: actions/checkout@v7.0.1
        with:
          repository: ATTWoWAddon/AllTheThings
          ref: master
          path: .cache/AllTheThings
          fetch-depth: 1

      - name: Read source revision
        id: sources
        run: |
          set -euo pipefail
          if [[ -f export/forever/manifest.json ]]; then
            old_att=$(jq -r '.commit // "none"' export/forever/manifest.json)
          else
            old_att=none
          fi
          att_sha=$(git -C .cache/AllTheThings rev-parse HEAD)
          generated_at=$(git -C .cache/AllTheThings log -1 --format=%cI)
          printf 'old_att=%s\natt=%s\ngenerated_at=%s\n' \
            "$old_att" "$att_sha" "$generated_at" >> "$GITHUB_OUTPUT"

      - name: Export ATT Forever quests
        run: |
          set -euo pipefail
          go run ./cmd/compile \
            --att-root .cache/AllTheThings \
            --att-commit "${{ steps.sources.outputs.att }}" \
            --generated-at "${{ steps.sources.outputs.generated_at }}" \
            --out export/forever
          go test ./...

      - name: Detect export changes
        id: changes
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- export/forever)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          printf 'quests=%s\n' "$(jq -r '.questCount' export/forever/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Close stale database pull request
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main \
            --head att-update --state open --limit 1 --json number --jq '.[0].number // empty')
          if [[ -z "$pr_number" ]]; then
            echo "No stale Forever database pull request is open."
            exit 0
          fi
          gh pr close "$pr_number" --repo "$GITHUB_REPOSITORY" --delete-branch \
            --comment "Closing automatically because the regenerated Forever export now matches main."

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: att-update
          delete-branch: true
          commit-message: "chore: refresh Forever quest export from ATT"
          title: "chore: refresh Forever quest export from ATT"
          assignees: TylerAkins
          add-paths: export/forever
          body: |
            Automated regeneration of `export/forever` from the Forever database in [AllTheThings](https://github.com/ATTWoWAddon/AllTheThings).

            | Source | Previous SHA | Updated SHA |
            |---|---|---|
            | AllTheThings | `${{ steps.sources.outputs.old_att }}` | `${{ steps.sources.outputs.att }}` |

            The Go compiler reads ATT `.contrib/.db/forever` quest declarations directly. The manifest records any unmapped coordinate issues.
